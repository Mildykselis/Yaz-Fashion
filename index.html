<style>
:root{--bg:#FFFFFF;--gold:#F8D36A;--soft:#FFE9A8;--cream:#FFF7DF;--ink:#4a3708;--mut:#8a7338;--deep:#C79A1E;--gl1:rgba(255,255,255,.92);--gl2:rgba(255,250,235,.5);--gb:rgba(255,255,255,.75);--sh:rgba(190,140,20,.2);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
:root:not([data-theme="light"]){}

:root[data-theme="dark"]{--bg:#2b2208;--soft:#4a3a10;--ink:#FFF2CC;--mut:#cdb36a;--gl1:rgba(255,233,168,.16);--gl2:rgba(255,233,168,.05);--gb:rgba(255,233,168,.28);--sh:rgba(0,0,0,.4)}
*,*:before,*:after{box-sizing:inherit}
html,body{margin:0}body{background:var(--bg);color:var(--ink);font-size:calc(16px*var(--fs,1));font-family:Outfit,system-ui,sans-serif;min-height:100%;-webkit-tap-highlight-color:transparent}
.blob{position:fixed;border-radius:50%;filter:blur(60px);z-index:0;pointer-events:none;animation:dr 18s ease-in-out infinite alternate}
.b1{width:300px;height:300px;background:var(--gold);top:-80px;right:-80px;opacity:.22}.b2{width:260px;height:260px;background:var(--soft);bottom:20%;left:-90px;opacity:.3;animation-delay:-6s}

.glass{background:linear-gradient(135deg,var(--gl1),var(--gl2));backdrop-filter:blur(var(--bl,22px)) saturate(180%);-webkit-backdrop-filter:blur(var(--bl,22px)) saturate(180%);border:1px solid var(--gb);box-shadow:inset 0 1px 0 var(--gb),inset 0 -1px 0 rgba(248,211,106,.35),0 10px 30px var(--sh);border-radius:var(--rd,24px)}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:500;margin:0}
h2{font-size:26px;margin:18px 4px 10px}
.top{display:flex;align-items:center;gap:10px;padding:8px 12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:5}
.top img{width:44px;height:44px;border-radius:50%;object-fit:cover}.top h1{font-size:20px;flex:1;font-style:italic}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--deep);outline-offset:2px}
.btn{background:linear-gradient(180deg,#FFE9A8,var(--gold));color:#4a3708;font-weight:600;padding:13px 20px;border-radius:999px;box-shadow:inset 0 1px 0 #fff9,0 6px 16px var(--sh);transition:transform .15s}
.btn:active{transform:scale(.96)}.btn.sm{padding:8px 14px;font-size:14px}.btn.ghost{background:var(--gl1);border:1px solid var(--gb)}
.search{display:flex;gap:8px;align-items:center;padding:10px 16px;margin:10px 0}.search input{flex:1;background:none;border:0;font:inherit;color:inherit;outline:0}
.hero{padding:26px 22px;margin-top:8px;position:relative;overflow:hidden;background-image:linear-gradient(125deg,var(--gl1) 30%,var(--gold))}.hero h2{font-size:34px;margin:0 0 8px;line-height:1.1}.hero p{margin:0 0 16px;color:var(--mut);max-width:30ch}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}.chip{padding:9px 16px;border-radius:999px;white-space:nowrap;background:var(--gl1);border:1px solid var(--gb)}.chip.on{background:var(--gold);color:#4a3708;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{padding:8px;text-align:left;display:block;width:100%}.tile{aspect-ratio:3/4;border-radius:18px;display:grid;place-items:center;position:relative;overflow:hidden}.tile img{width:100%;height:100%;object-fit:cover}
.tile svg{width:46%;opacity:.55}.card b{display:block;margin:8px 4px 0;font-weight:500}.card span{margin:0 4px;color:var(--mut);font-size:14px}
.heart{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center}.heart.on svg{fill:var(--deep);stroke:var(--deep)}
.col{height:150px;margin-bottom:12px;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;width:100%;text-align:left}.col h3{font-size:24px}.col span{color:var(--mut)}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:10;display:flex;gap:2px;padding:6px;width:min(calc(100% - 24px),520px);border-radius:999px}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;border-radius:999px;font-size:10.5px;color:var(--mut);position:relative;transition:background .3s,color .3s}
.nav button.on{background:linear-gradient(180deg,#fff7,var(--gold));color:#4a3708;box-shadow:inset 0 1px 0 #fff9,0 4px 12px var(--sh)}
.badge{position:absolute;top:2px;right:calc(50% - 20px);background:var(--deep);color:#fff;font-size:10px;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(74,55,8,.35);display:flex;align-items:flex-end;justify-content:center;animation:fi .2s}
.sheet>div{width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:20px 20px calc(env(safe-area-inset-bottom,0px) + 20px);border-radius:32px 32px 0 0;background:linear-gradient(160deg,var(--gl1),var(--bg) 70%);animation:up .3s cubic-bezier(.2,.9,.3,1)}
@keyframes fi{from{opacity:0}}@keyframes up{from{transform:translateY(40px);opacity:0}}
.row{display:flex;align-items:center;gap:12px;padding:10px;margin-bottom:10px}.row .tile{width:64px;aspect-ratio:1;flex:none}.row>div:nth-child(2){flex:1}

.st{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--gold);color:#4a3708}.tot{display:flex;justify-content:space-between;font-size:20px;margin:14px 4px}
.fx{display:flex;gap:8px;flex-wrap:wrap}
.off{position:absolute;left:8px;top:8px;background:var(--deep);color:#fff;font:600 12px Outfit,sans-serif;padding:4px 9px;border-radius:999px}
.av{width:64px;height:64px;border-radius:50%;object-fit:cover;display:grid;place-items:center;background:linear-gradient(145deg,#fff,var(--gold));font:500 28px Fraunces,Georgia,serif;flex:none;border:2px solid #fff;box-shadow:0 4px 14px var(--sh);color:#4a3708}

.lg img{position:absolute;inset:12px;width:calc(100% - 24px);height:calc(100% - 24px);border-radius:50%;object-fit:cover;animation:pulse 1.6s ease-in-out infinite}
#splash h1{font-size:28px;font-style:italic;margin:18px 0 0}
.ld{width:min(240px,60vw);height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin:20px 0 10px}
.ld i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--deep),var(--gold));background-size:200% 100%;animation:shine 1s linear infinite;transition:width .25s}
#ldt{color:var(--mut);font-size:14px;margin:0;min-height:20px}

.hero2{text-align:center;padding:8px 0 4px}
.trio{display:flex;justify-content:center;align-items:flex-end;gap:14px;margin:10px 0 22px;padding:0 10px}
.fr{position:relative;width:30%;padding:0;background:#fff;box-shadow:0 12px 28px var(--sh);border-radius:3px}
.fr:before{content:"";position:absolute;inset:-9px 9px 9px -9px;border:2px solid var(--gold);z-index:-1}
.fr .tile{border-radius:2px;aspect-ratio:3/4.3}.fr.f1{width:34%;transform:translateY(-12px)}
.hero2 h2{font-size:clamp(30px,9vw,46px);text-transform:uppercase;line-height:1;margin:6px 0 4px}
.hero2 p{color:var(--mut);margin:0 0 14px}
.promo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 16px}.promo>div{background:var(--soft);padding:14px 8px;border-radius:3px}
.promo b{display:block;font:600 28px Fraunces,Georgia,serif}.promo span{font-size:13px;color:var(--mut)}

.hero2{max-width:640px;margin:0 auto}

function sheet(h){$("#ov").innerHTML=`<div class="sheet" data-a="close"><div class="glass">${h}</div></div>`}
const close=()=>$("#ov").innerHTML="";
function open(id){const p=S.P.find(x=>x.id==id);S.sel=p.sizes[0];sheet(`<div class="tile" style="aspect-ratio:4/3;margin-bottom:12px;background:linear-gradient(145deg,${p.c1},${p.c2})">${p.img?`<img src="${p.img}" alt="${p.name}">`:HG}</div><h3 style="font-size:26px">${p.name}</h3><p style="color:var(--mut);margin:4px 0">${p.cat} · ${p.col}</p><h3>${money(p.price)} ${p.old?`<s style="font-size:16px;color:var(--mut)">${money(p.old)}</s> <span class="st">-${Math.round(100-p.price/p.old*100)}%</span>`:""}</h3><p style="color:var(--mut);margin:4px 0">${p.brand||"Yaz"} · ${p.stock<1?"Agotado":p.stock<6?"Últimas "+p.stock+" piezas":"Envío gratis desde $999"}</p><label>Talla</label><div class="sizes">${p.sizes.map((s,i)=>`<button class="chip ${i?"":"on"}" data-a="size" data-v="${s}">${s}</button>`).join("")}</div><div class="fx"><button class="btn" style="flex:1" data-a="add2" data-id="${p.id}">Agregar al carrito</button><button class="btn ghost" data-a="fav" data-id="${p.id}" aria-label="Favorito">${ic("fav")}</button></div>`)}
function img2url(f,m=600){return new Promise(r=>{const i=new Image();i.onload=()=>{const s=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*s;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);r(c.toDataURL("image/jpeg",.75))};i.src=URL.createObjectURL(f)})}
const A={
go:e=>{S.v=e.v;S.ed=null;if(e.v!="cols")S.col="";render();scrollTo(0,0);if(["acc","users","orders"].includes(e.v))refresh()},
setcat:e=>{S.cat=e.v;render()},pickcol:e=>{S.col=e.v;S.v="cols";render()},sort:e=>{S.sort=e.v;render()},coupon:()=>{S.coupon=$("#cup").value.trim().toUpperCase();toast(S.coupon=="YAZ10"?"Cupón aplicado: 10%":"Cupón no válido");render()},
os:(e,ev)=>{S.os=ev.target.value;sv("yz_os",S.os);applyOS();render()},seas:(e,ev)=>{try{localStorage.setItem("yz_se",ev.target.value)}catch(x){}location.reload()},
google:()=>{if(!CFG.GOOGLE)return finish({id:"cliente.google@gmail.com",name:"Cliente Google",email:"cliente.google@gmail.com",prov:"google"},"Modo demo: cuenta de Google simulada");const go=()=>{google.accounts.id.initialize({client_id:CFG.GOOGLE,callback:async r=>finish(await api("POST","/auth/google",{credential:r.credential}))});google.accounts.id.prompt()};if(window.google&&google.accounts)return go();const s=document.createElement("script");s.src="https://accounts.google.com/gsi/client";s.onload=go;document.head.appendChild(s)},
editme:()=>{const u=S.user;sheet(`<h3>Mis datos</h3><div style="text-align:center;margin:10px">${av(u)}</div><label>Foto de perfil</label><input id="ef" type="file" accept="image/*"><label>Nombre</label><input id="en" value="${u.name||""}"><label>Correo</label><input id="ee" type="email" value="${u.email||""}"><label>Teléfono</label><input id="ep" type="tel" value="${u.phone||""}"><label>Dirección</label><textarea id="ea" rows="2">${u.addr||""}</textarea><label>Cumpleaños</label><input id="eb" type="date" value="${u.bday||""}"><button class="btn" style="width:100%" data-a="saveme">Guardar cambios</button>`)},
saveme:async()=>{const f=$("#ef").files[0],d={name:$("#en").value.trim()||S.user.name,email:$("#ee").value.trim(),phone:$("#ep").value.trim(),addr:$("#ea").value.trim(),bday:$("#eb").value};if(f)d.avatar=await img2url(f,160);try{S.user=await api("POST","/users",{...S.user,...d});S.user.admin=S.user.admin||false;sv("yz_u",S.user);close();render();toast("Datos actualizados")}catch(e){toast("No se pudo guardar")}},
edit:e=>{S.ed=S.P.find(p=>p.id==e.id);render();scrollTo(0,0)},
fav:e=>{const i=S.fav.indexOf(e.id);i<0?S.fav.push(e.id):S.fav.splice(i,1);sv("yz_f",S.fav);render();if($("#ov").innerHTML)open(e.id)},
open:e=>open(e.id),close:(e,ev)=>{if(ev.target.classList.contains("sheet"))close()},
size:e=>{S.sel=e.v;document.querySelectorAll(".sizes .chip").forEach(c=>c.classList.toggle("on",c.dataset.v==e.v))},
add2:e=>{const p=S.P.find(x=>x.id==e.id);if(p.stock<1)return toast("Producto agotado");const f=S.cart.find(i=>i.id==p.id&&i.size==S.sel);f?f.qty++:S.cart.push({...p,size:S.sel,qty:1});sv("yz_c",S.cart);close();render();toast("Agregado al carrito")},
qty:e=>{const i=S.cart[e.n];i.qty+=+e.d;if(i.qty<1)S.cart.splice(e.n,1);sv("yz_c",S.cart);render()},
checkout:()=>sheet(`<h3>Datos de entrega</h3><label>Nombre</label><input id="cn" value="${S.user?S.user.name:""}"><label>WhatsApp / teléfono</label><input id="cp" type="tel" value="${S.user?S.user.phone:""}"><label>Dirección</label><textarea id="ca" rows="2">${S.user&&S.user.addr||""}</textarea><label>Método de pago</label><select id="cm"><option>Tarjeta al recibir</option><option>Transferencia</option><option>Pago en tienda</option><option>Efectivo contra entrega</option></select><button class="btn" style="width:100%" data-a="order">Confirmar pedido</button>`),
order:async()=>{const n=$("#cn").value.trim(),p=$("#cp").value.trim(),a=$("#ca").value.trim();if(!n||!p||!a)return toast("Completa todos los datos");
 const o={id:"o"+Date.now(),ts:Date.now(),name:n,phone:p,addr:a,items:S.cart.map(i=>({id:i.id,name:i.name,size:i.size,qty:i.qty,price:i.price})),total:calc().t,pay:$("#cm").value,uid:S.user?S.user.id:p,status:"Nuevo"};
 try{await api("POST","/orders",o);S.O.unshift(o);S.cart=[];sv("yz_c",[]);S.user=S.user||{id:p,name:n,phone:p,prov:"manual"};sv("yz_u",S.user);api("POST","/users",S.user).catch(()=>{});close();S.v="acc";render();toast("Pedido enviado. Gracias, "+n)}catch(e){toast("No se pudo enviar. Intenta de nuevo")}},
login:()=>{const n=$("#un").value.trim(),e=$("#ue").value.trim().toLowerCase(),p=$("#up").value.trim();if(!n||!(e||p))return toast("Escribe tu nombre y correo o teléfono");finish({id:e||p,name:n,email:e,phone:p,prov:"manual"})},
logout:()=>{S.user=null;S.pin="";sv("yz_u",null);sv("yz_pin","");render()},
adm:()=>{if($("#pin").value!=CFG.PIN)return toast("PIN incorrecto");S.user.admin=true;S.pin=CFG.PIN;sv("yz_u",S.user);sv("yz_pin",S.pin);render();refresh()},
saveP:async()=>{const n=$("#pn").value.trim(),pr=+$("#pp").value;if(!n||!pr)return toast("Falta nombre o precio");const E=S.ed||{},f=$("#pf").files[0],p={...E,id:E.id||"p"+Date.now(),name:n,price:pr,brand:$("#pb").value.trim()||"Yaz",old:+$("#pq").value||0,stock:+$("#pk").value,desc:$("#pd").value.trim(),cat:$("#pc").value,col:$("#po").value,c1:"#FFE9A8",c2:"#F8D36A",sizes:$("#ps").value.split(",").map(s=>s.trim()).filter(Boolean),img:f?await img2url(f):E.img||""};
 try{await api(E.id?"PATCH":"POST",E.id?"/products/"+E.id:"/products",p);S.P=E.id?S.P.map(x=>x.id==E.id?p:x):[p,...S.P];S.ed=null;render();toast(E.id?"Cambios guardados":"Modelo publicado")}catch(e){toast("No se pudo publicar")}},
pers:()=>{const p=PF,ch=(k,a)=>`<div class="chips">${a.map(x=>`<button class="chip ${p[k]==x[0]?"on":""}" data-a="pf" data-k="${k}" data-v="${x[0]}">${x[1]}</button>`).join("")}</div>`;sheet(`<h3>Personalizar</h3><label>Tema (se adapta a tu pantalla en Automático)</label>${ch("theme",[["white","Blanco y dorado"],["cream","Crema dorada"],["dark","Oscuro dorado"],["auto","Automático"]])}<label>Color dorado</label><div class="fx" style="margin:8px 0 14px">${[["season","Temporada",SE[1]],["#F8D36A","Dorado","#F8D36A"],["#E9A93B","Miel","#E9A93B"],["#F3E2A9","Champagne","#F3E2A9"],["#EFC3A5","Rosa oro","#EFC3A5"]].map(x=>`<button class="sw ${p.acc==x[0]?"on":""}" data-a="pf" data-k="acc" data-v="${x[0]}" style="background:${x[2]}" aria-label="${x[1]}"></button>`).join("")}</div><label>Cristal líquido (desenfoque)</label><input type="range" min="6" max="40" value="${p.bl}" data-a="pfr" data-k="bl"><label>Esquinas</label>${ch("rd",[["12","Suaves"],["24","Redondas"],["34","Cápsula"]])}<label>Tamaño de letra</label>${ch("fs",[["0.92","Pequeña"],["1","Normal"],["1.12","Grande"]])}<label>Interfaz</label><select data-a="os">${opt([["auto","Automática"],["ios","iPhone"],["android","Android"]],S.os)}</select>${admin()?`<label>Temporada de la tienda</label><select data-a="seas">${opt([["auto","Automática por fecha"],[0,"Invierno"],[1,"Primavera"],[2,"Verano"],[3,"Otoño"]],ld0("yz_se")||"auto")}</select>`:""}<div class="fx"><button class="chip" data-a="pf" data-k="calm" data-v="${!p.calm}">${p.calm?"Activar":"Quitar"} movimiento de fondo</button><button class="chip" data-a="pfreset">Restablecer</button></div>`)},
pf:e=>{const v=e.v;PF[e.k]=v=="true"?true:v=="false"?false:(e.k=="theme"||e.k=="acc")?v:+v;sv("yz_pref",PF);applyPrefs();A.pers()},
pfreset:()=>{Object.assign(PF,{theme:"white",acc:"season",bl:22,rd:24,fs:1,calm:false});sv("yz_pref",PF);applyPrefs();A.pers()},
del:async e=>{await api("DELETE","/products/"+e.id);S.P=S.P.filter(p=>p.id!=e.id);render()},
status:async(e,ev)=>{await api("PATCH","/orders/"+e.id,{status:ev.target.value});toast("Estado actualizado");S.O=await api("GET","/orders")}};
document.addEventListener("click",ev=>{const t=ev.target.closest("[data-a]");if(!t||t.tagName=="SELECT")return;A[t.dataset.a]&&A[t.dataset.a](t.dataset,ev)});
document.addEventListener("change",ev=>{const a=ev.target.dataset.a;if(a=="status"||a=="os"||a=="seas")A[a](ev.target.dataset,ev)});
document.addEventListener("input",ev=>{const t=ev.target;if(t.dataset.a=="pfr"){PF[t.dataset.k]=+t.value;sv("yz_pref",PF);applyPrefs()}});
(async()=>{try{S.P=await api("GET","/products");if(!S.P.length)S.P=SEED;S.O=admin()||S.user?await api("GET","/orders").catch(()=>[]):[]}catch(e){S.P=SEED}applyOS();render();refresh();hideSplash()})();
function hideSplash(){const s=$("#splash");if(!s)return;clearInterval(window.__ld);$("#ldb").style.width="100%";$("#ldt").textContent="¡Listo!";setTimeout(()=>{s.classList.add("out");setTimeout(()=>s.remove(),600)},Math.max(300,1800-performance.now()))}
